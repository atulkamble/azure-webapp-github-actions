
# Python CI/CD Deployment to Azure App Service
#
# Prerequisites:
# 1. Create an Azure App Service Web App.
# 2. Create an Azure Service Principal.
# 3. Add AZURE_CREDENTIALS to GitHub Secrets.
# 4. Update AZURE_WEBAPP_NAME below.
# 5. Ensure the Azure Web App supports Python 3.13.

name: Build and Deploy Python App to Azure Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: your-app-name
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Build Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify Python Version
        run: |
          python --version
          pip --version

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Application
        run: |
          python -m compileall -q .

      # Optional: Run application tests here.

      - name: Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.git/
            !.github/
            !__pycache__/
            !.pytest_cache/

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    environment:
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download Artifact from Build Job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: |
          az account show --output table

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .

      - name: Logout from Azure
        if: always()
        run: az logout
